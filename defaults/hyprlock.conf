# NEUTRAL FALLBACK -- seeded by install.sh only when no themed file exists.
# Edit ~/.config/matugen/templates/hyprlock.conf instead, then run: wallpaper
#
# Reached from the power menu's Lock button and from SUPER + L.
# Based on the sample at /usr/share/hypr/hyprlock.conf.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    rounding = 22

    inner_color = rgba(0b0c0edd)
    outer_color = rgb(9db4c8)
    check_color = rgb(e6c07b)
    fail_color  = rgb(ffb4ab)
    font_color  = rgb(e3e4e6)

    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -80
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(e3e4e6)

    position = 0, 120
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    color = rgb(909398)

    position = 0, 40
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
# Display only. The sample config puts `hyprctl switchxkblayout all next` on an
# onclick here, which moves Hyprland's `main` keyboard flag onto one of the
# phantom input devices -- the same trap the bar's KeyboardLayout module works
# around. Not worth re-introducing on a lock screen.
label {
    monitor =
    text = $LAYOUT
    font_size = 16
    font_family = $font
    color = rgb(909398)

    position = 0, -130
    halign = center
    valign = center
}
