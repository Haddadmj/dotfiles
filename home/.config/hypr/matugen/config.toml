[config]

[templates.hyprland]
input_path = "__HOME__/.config/hypr/matugen/templates/hypr-colors.lua"
output_path = "__HOME__/.config/hypr/colors.lua"

[templates.kde]
input_path = "__HOME__/.config/hypr/matugen/templates/kde.colors"
output_path = "__HOME__/.cache/matugen/Matugen.colors"

[templates.quickshell]
input_path = "__HOME__/.config/hypr/matugen/templates/quickshell-colors.json"
output_path = "__HOME__/.config/quickshell/colors.json"

[templates.ghostty]
input_path = "__HOME__/.config/hypr/matugen/templates/ghostty-colors"
output_path = "__HOME__/.config/ghostty/colors"
