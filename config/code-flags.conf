# One flag per line. `#` starts a comment (the /usr/bin/code wrapper strips
# them, then joins the lines with spaces).

--password-store=basic

# Native Wayland. UseOzonePlatform is deliberately absent: Ozone has been
# Electron's default since 28 (VS Code 1.86), so the feature flag is a no-op
# and is the only thing VS Code's own argv validator complains about.
--ozone-platform=wayland
