# GENERATED from the current wallpaper by matugen -- do not edit by hand.
# Edit ~/.config/matugen/templates/hyprlock.conf instead, then run: wallpaper
#
# Reached from the power menu's Lock button and from SUPER + L.
# Based on the sample at /usr/share/hypr/hyprlock.conf.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    rounding = 22

    inner_color = rgba({{colors.surface_container_lowest.default.hex_stripped}}dd)
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color  = rgb({{colors.error.default.hex_stripped}})
    font_color  = rgb({{colors.on_surface.default.hex_stripped}})

    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -80
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb({{colors.on_surface.default.hex_stripped}})

    position = 0, 120
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    color = rgb({{colors.outline.default.hex_stripped}})

    position = 0, 40
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
# Display only. The sample config puts `hyprctl switchxkblayout all next` on an
# onclick here, which moves Hyprland's `main` keyboard flag onto one of the
# phantom input devices -- the same trap the bar's KeyboardLayout module works
# around. Not worth re-introducing on a lock screen.
label {
    monitor =
    text = $LAYOUT
    font_size = 16
    font_family = $font
    color = rgb({{colors.outline.default.hex_stripped}})

    position = 0, -130
    halign = center
    valign = center
}
