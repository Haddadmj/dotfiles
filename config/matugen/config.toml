# matugen -- wallpaper-driven theming.
# Driven by the `wallpaper` script; run that rather than matugen directly.

[config]

[templates.quickshell]
input_path = '~/.config/matugen/templates/Colors.qml'
output_path = '~/.config/quickshell/Colors.qml'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock.conf'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/style.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
