; Feral gamemoded configuration.
;
; The custom hooks below are what make the desktop react to a game starting.
; Every installed title already carries `gamemoderun mangohud %command%` as its
; Steam launch option (set by ~/.local/bin/steam-launch-options), so launching
; anything from Steam strips the desktop down and quitting restores it -- no
; keybind needed. SUPER + ALT + G still toggles it by hand for non-Steam games.
;
; Check it is being picked up with: gamemoded -t

[general]
; Ask the CPU governor for performance while a game holds the lock.
desiredgov=performance
softrealtime=auto
renice=10

; There is deliberately no [gpu] section. The RTX 4070 is undervolted through
; LACT and letting gamemoded push clocks on top of that fights the profile in
; its config.yaml. Leaving the section out entirely is the way to express that:
; writing `apply_gpu_optimisations=0` explicitly makes `gamemoded -t` report
; ":: Verifying GPU Optimisations ... Failed!", whereas with no section at all
; it reports "Passed (gpu optimisations not configured to run)" -- same runtime
; behaviour, but only one of them leaves a clean test run.

[custom]
start=/home/mohammad/.local/bin/game-mode on
end=/home/mohammad/.local/bin/game-mode off
