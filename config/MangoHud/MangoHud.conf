### MangoHud global config
### Per-game overrides go in ~/.config/MangoHud/<executable_name>.conf
### Reload in-game without restarting: Shift_L+F4

################ GPU #################
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
## Show only the RTX 4070; hides the idle AMD Raphael iGPU at 0000:0c:00.0
pci_dev=0000:01:00.0

################ CPU #################
cpu_stats
cpu_temp
cpu_mhz

############### MEMORY ###############
## Follows the pinned GPU above, so this is the RTX 4070's VRAM
vram
ram

########### FPS / FRAMETIME ##########
fps
frametime
frame_timing
## Average FPS plus 1% lows - the real smoothness metric
fps_metrics=avg,0.01

## Only appears when the GPU is limited by power, temp, or current
throttling_status

################ INFO ################
gpu_name
vulkan_driver
resolution

############### VISUAL ###############
position=top-left
font_size=22
background_alpha=0.4
round_corners=8
text_outline
